<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>书签页 · 方案 1 过滤条样板（待确认）</title>
<style>
  :root {
    --bg: #141414;
    --surface: #1e1e1e;
    --surface-2: #262626;
    --surface-3: #2f2f2f;
    --border: #3a3a3a;
    --border-2: #2c2c2c;
    --text: #e6e6e6;
    --text-2: #b0b0b0;
    --muted: #7a7a7a;
    --gold: #e6b800;
    --role-newest: #4fa3e3;
    --role-oldest: #4cc38a;
    --role-interest: #9a9a9a;
    --bulk: #e6b800;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── 模拟真实壳层（左侧栏 + 顶栏全局搜索）方便直观感受层级 ─── */
  .shell {
    display: flex;
    min-height: 100vh;
  }
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: #191919;
    border-right: 1px solid var(--border-2);
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .logo {
    font-weight: 700;
    font-size: 0.95rem;
    padding: 4px 8px 14px;
    color: var(--text);
    border-bottom: 1px solid var(--border-2);
    margin-bottom: 6px;
  }
  .nav-item {
    padding: 8px 10px;
    border-radius: 7px;
    font-size: 0.84rem;
    color: var(--text-2);
  }
  .nav-item.active {
    background: rgba(79, 163, 227, 0.14);
    color: var(--role-newest);
    font-weight: 600;
  }
  .main-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  /* ─── 全局 TopBar（保持原样：宽居中搜本子）─── */
  .top-bar {
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border-2);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .global-search {
    width: 100%;
    max-width: 560px;
    height: 36px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 18px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 8px;
    color: var(--muted);
    font-size: 0.84rem;
  }
  .global-search .gs-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .global-search .gs-tag {
    font-size: 0.72rem;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--surface-3);
    color: var(--text-2);
  }

  /* ─── 书签页主体 ─── */
  .bm-page {
    padding: 18px 22px 48px;
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
  }
  .bm-page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .bm-head-left {
    display: flex;
    align-items: baseline;
    gap: 12px;
    min-width: 0;
    flex-wrap: wrap;
  }
  .bm-page-title {
    font-size: 1.1rem;
    margin: 0;
    color: var(--text);
  }
  .bm-page-stat {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .bm-probe-btn {
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: var(--text-2);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.82rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .bm-probe-btn:hover {
    color: var(--text);
    border-color: var(--muted);
  }

  /* ─── 方案 1 新增：页内轻量过滤条（左胶囊 + 右窄筛选框）─── */
  .bm-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding: 8px 10px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--border-2);
    border-radius: 10px;
  }
  .bm-role-tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .bm-tab {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-2);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.14s ease;
  }
  .bm-tab:hover {
    background: var(--surface-2);
    color: var(--text);
  }
  .bm-tab .cnt {
    font-size: 0.72rem;
    color: var(--muted);
  }
  .bm-tab.active {
    background: var(--surface-2);
    border-color: var(--border);
    color: var(--text);
    font-weight: 600;
  }
  .bm-tab.active.role-newest {
    border-color: rgba(79, 163, 227, 0.55);
    color: var(--role-newest);
    background: rgba(79, 163, 227, 0.1);
  }
  .bm-tab.active.role-oldest {
    border-color: rgba(76, 195, 138, 0.55);
    color: var(--role-oldest);
    background: rgba(76, 195, 138, 0.1);
  }
  .bm-tab.active.role-interest {
    border-color: rgba(154, 154, 154, 0.55);
    color: var(--text);
    background: rgba(255, 255, 255, 0.07);
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot.newest { background: var(--role-newest); }
  .dot.interest { background: var(--role-interest); }
  .dot.oldest { background: var(--role-oldest); }

  /* 右侧紧凑筛选输入框（刻意窄于顶栏、视觉更轻，避免双搜索框打架） */
  .bm-filter-box {
    position: relative;
    display: flex;
    align-items: center;
    width: 240px;
    max-width: 100%;
  }
  .bm-filter-icon {
    position: absolute;
    left: 9px;
    color: var(--muted);
    font-size: 0.78rem;
    pointer-events: none;
  }
  .bm-filter-input {
    width: 100%;
    height: 30px;
    padding: 0 26px 0 28px;
    border-radius: 7px;
    border: 1px solid var(--border-2);
    background: var(--bg);
    color: var(--text);
    font-size: 0.8rem;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .bm-filter-input::placeholder {
    color: var(--muted);
  }
  .bm-filter-input:focus {
    border-color: var(--border);
  }
  .bm-filter-clear {
    position: absolute;
    right: 6px;
    width: 18px;
    height: 18px;
    border: none;
    border-radius: 50%;
    background: var(--surface-3);
    color: var(--text-2);
    font-size: 0.72rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .bm-filter-clear.visible {
    display: inline-flex;
  }
  .bm-filter-clear:hover {
    color: var(--text);
  }

  /* ─── 名片墙 ─── */
  .bm-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }
  .bm-divider {
    height: 1px;
    background: var(--border);
    margin: 18px 2px;
  }
  .bm-card {
    position: relative;
    display: flex;
    gap: 10px;
    height: 184px;
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .bm-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
  }
  .bm-card.role-newest::before { background: var(--role-newest); }
  .bm-card.role-oldest::before { background: var(--role-oldest); }
  .bm-card.role-interest::before { background: var(--role-interest); }
  .bm-card.updated {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(230, 184, 0, 0.18);
  }
  .cover {
    flex-shrink: 0;
    width: 112px;
    height: 160px;
    border-radius: 6px;
    background: linear-gradient(155deg, #2b2b2b, #202020);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: #555;
  }
  .body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .title-row {
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .title {
    font-size: 0.96rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .subtitle {
    height: 18px;
    margin-top: 2px;
    font-size: 0.74rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badges {
    height: 22px;
    margin-top: 7px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .badge {
    font-size: 0.68rem;
    line-height: 1.5;
    padding: 0 5px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--text-2);
  }
  .badge.role-newest { border-color: rgba(79, 163, 227, 0.45); color: var(--role-newest); }
  .badge.role-oldest { border-color: rgba(76, 195, 138, 0.45); color: var(--role-oldest); }
  .badge.bulk { border-color: rgba(230, 184, 0, 0.4); color: var(--bulk); }
  .note-box {
    height: 76px;
    margin-top: 8px;
    padding: 7px 9px;
    border: 1px solid var(--border-2);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.02);
    font-size: 0.76rem;
    line-height: 1.45;
    color: var(--text-2);
    overflow: hidden;
  }
  .note-box.empty { color: var(--muted); }

  .empty-state {
    padding: 56px 0;
    text-align: center;
    color: var(--muted);
    font-size: 0.88rem;
  }
  .reset-btn {
    margin-left: 8px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-2);
    font-size: 0.78rem;
    cursor: pointer;
  }
  .reset-btn:hover { color: var(--text); }

  @media (max-width: 1100px) {
    .bm-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 820px) {
    .sidebar { display: none; }
    .bm-filter-box { width: 100%; }
  }
  @media (max-width: 640px) {
    .bm-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <!-- 左侧栏占位 -->
  <aside class="sidebar">
    <div class="logo">E-Manager · 在线</div>
    <div class="nav-item">在线首页</div>
    <div class="nav-item">在线热门</div>
    <div class="nav-item">在线订阅</div>
    <div class="nav-item active">书签</div>
    <div class="nav-item">在线历史</div>
  </aside>

  <div class="main-col">
    <!-- 全局 TopBar（原样保留） -->
    <header class="top-bar">
      <div class="global-search">
        <span>🔍</span>
        <span class="gs-text">全局搜索 E 站画廊（回车跳回在线首页）…</span>
        <span class="gs-tag">筛选</span>
      </div>
    </header>

    <!-- 书签页主体 -->
    <main class="bm-page">
      <header class="bm-page-head">
        <div class="bm-head-left">
          <h2 class="bm-page-title">书签</h2>
          <span id="statText" class="bm-page-stat"></span>
        </div>
        <button class="bm-probe-btn">↻ 检查更新</button>
      </header>

      <!-- 方案 1：单行页内过滤条 -->
      <section class="bm-toolbar" aria-label="书签筛选">
        <div class="bm-role-tabs" id="roleTabs"></div>
        <div class="bm-filter-box">
          <span class="bm-filter-icon">⌕</span>
          <input
            id="filterInput"
            class="bm-filter-input"
            type="text"
            placeholder="筛选当前书签（标题 / 副标题）…"
            autocomplete="off"
          />
          <button id="clearBtn" class="bm-filter-clear" title="清空">×</button>
        </div>
      </section>

      <div id="content"></div>
    </main>
  </div>
</div>

<script>
const BOOKMARKS = [
  { id: 1, pinned: true,  updated: true,  role: 'newest',   bulk: false, watch: true,  title: '水龙敬', subtitle: '搜索: artist:mizuryu kei · 中文', note: '2026-10 已扫到最新，开启每日探测' },
  { id: 2, pinned: true,  updated: false, role: 'oldest',   bulk: true,  watch: false, title: '东方 Project 续扫', subtitle: '搜索: parody:touhou project · 中文 · 仅种子', note: '已囤完 2024 之后，继续往旧翻' },
  { id: 3, pinned: false, updated: true,  role: 'newest',   bulk: false, watch: true,  title: '碧蓝档案', subtitle: '搜索: parody:blue archive · 中文', note: '' },
  { id: 4, pinned: false, updated: false, role: 'interest', bulk: false, watch: false, title: '搜索: female:elf', subtitle: '搜索: female:elf · 4星以上', note: '有空再系统翻一遍' },
  { id: 5, pinned: false, updated: false, role: 'oldest',   bulk: false, watch: false, title: '纯爱向合集', subtitle: '搜索: group:circle_abc · 中文', note: '翻到 2021 年中段，待继续' },
  { id: 6, pinned: false, updated: false, role: 'newest',   bulk: true,  watch: true,  title: '首页总流', subtitle: '首页 · 中文', note: '日常首页追新位' },
  { id: 7, pinned: false, updated: false, role: 'interest', bulk: true,  watch: false, title: '画集 / CG 坑', subtitle: '搜索: category:artistcg · 日文', note: '已做过一轮筛选' },
  { id: 8, pinned: false, updated: false, role: 'oldest',   bulk: false, watch: false, title: '老社团补档', subtitle: '搜索: artist:old_master', note: '2018-06 位置暂停' },
];

const ROLE_META = [
  { key: 'all',      label: '全部' },
  { key: 'newest',   label: '追新', dot: 'newest' },
  { key: 'interest', label: '兴趣', dot: 'interest' },
  { key: 'oldest',   label: '续扫', dot: 'oldest' },
];
const ROLE_LABEL = { newest: '追新', interest: '兴趣', oldest: '续扫' };

let activeRole = 'all';
let query = '';

const roleTabsEl = document.getElementById('roleTabs');
const filterInput = document.getElementById('filterInput');
const clearBtn = document.getElementById('clearBtn');
const statText = document.getElementById('statText');
const contentEl = document.getElementById('content');

function cardHTML(bm) {
  return `
    <article class="bm-card role-${bm.role} ${bm.updated ? 'updated' : ''}">
      <div class="cover">3:4 封面</div>
      <div class="body">
        <div class="title-row">
          <div class="title" title="${bm.title}">${bm.title}</div>
          <span style="color:var(--muted);font-size:0.85rem">⚙</span>
        </div>
        <div class="subtitle" title="${bm.subtitle}">${bm.subtitle}</div>
        <div class="badges">
          <span class="badge role-${bm.role}">${ROLE_LABEL[bm.role]}</span>
          ${bm.bulk ? '<span class="badge bulk">已囤货</span>' : ''}
          ${bm.watch ? '<span class="badge">🔔</span>' : ''}
        </div>
        <div class="note-box ${bm.note ? '' : 'empty'}">${bm.note || '（暂无备注）'}</div>
      </div>
    </article>`;
}

function render() {
  const kw = query.trim().toLowerCase();
  clearBtn.classList.toggle('visible', query.length > 0);

  // 统计各标记总数（按当前文本筛选或全量？展示全量便于切换）
  roleTabsEl.innerHTML = ROLE_META.map(m => {
    const cnt = m.key === 'all' ? BOOKMARKS.length : BOOKMARKS.filter(b => b.role === m.key).length;
    const cls = ['bm-tab', activeRole === m.key ? 'active' : '', m.key !== 'all' ? `role-${m.key}` : ''].join(' ');
    return `<button class="${cls}" data-role="${m.key}">
      ${m.dot ? `<span class="dot ${m.dot}"></span>` : ''}${m.label} <span class="cnt">${cnt}</span>
    </button>`;
  }).join('');

  const matched = BOOKMARKS.filter(b => {
    if (activeRole !== 'all' && b.role !== activeRole) return false;
    if (!kw) return true;
    return b.title.toLowerCase().includes(kw) || b.subtitle.toLowerCase().includes(kw);
  });

  const isFiltered = activeRole !== 'all' || kw.length > 0;
  const pinnedTotal = BOOKMARKS.filter(b => b.pinned).length;
  const updatedTotal = BOOKMARKS.filter(b => b.updated).length;
  statText.textContent = isFiltered
    ? `筛选命中 ${matched.length} / 共 ${BOOKMARKS.length} 条 · 置顶 ${pinnedTotal}/5 · 有更新 ${updatedTotal}`
    : `共 ${BOOKMARKS.length} 条 · 置顶 ${pinnedTotal}/5 · 有更新 ${updatedTotal}`;

  if (matched.length === 0) {
    contentEl.innerHTML = `<div class="empty-state">
      没有匹配的书签
      <button class="reset-btn" id="resetBtn">清空筛选</button>
    </div>`;
    document.getElementById('resetBtn').onclick = () => {
      activeRole = 'all';
      query = '';
      filterInput.value = '';
      render();
    };
    return;
  }

  const pinned = matched.filter(b => b.pinned);
  const normal = matched.filter(b => !b.pinned);
  let html = '';
  if (pinned.length) html += `<div class="bm-grid">${pinned.map(cardHTML).join('')}</div>`;
  if (pinned.length && normal.length) html += `<div class="bm-divider"></div>`;
  if (normal.length) html += `<div class="bm-grid">${normal.map(cardHTML).join('')}</div>`;
  contentEl.innerHTML = html;
}

roleTabsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-role]');
  if (!btn) return;
  activeRole = btn.dataset.role;
  render();
});
filterInput.addEventListener('input', (e) => {
  query = e.target.value;
  render();
});
clearBtn.addEventListener('click', () => {
  query = '';
  filterInput.value = '';
  filterInput.focus();
  render();
});

render();
</script>
</body>
</html>
