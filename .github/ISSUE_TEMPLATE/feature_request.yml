name: ✨ 功能建议
description: 提出新功能想法或交互体验改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与痛点
      description: 你在什么场景下遇到了什么不便？希望解决什么问题？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望实现的效果
      description: 描述你理想中的功能形态、交互方式或配置项
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 参考方案或补充说明（选填）
      description: 是否有参考的同类项目、设计草图或实现思路？
