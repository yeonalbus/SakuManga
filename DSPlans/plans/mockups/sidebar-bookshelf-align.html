<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>侧边栏 · 书架向书签看齐样板（待确认）</title>
<style>
  :root {
    --bg: #141414;
    --sidebar: #181818;
    --surface-2: #222222;
    --surface-3: #2a2a2a;
    --border: #3a3a3a;
    --border-2: #282828;
    --text: #e6e6e6;
    --text-2: #b5b5b5;
    --muted: #8a8a8a;
    --blue: #007acc;
    --green: #4cc38a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 24px 60px;
    background: var(--bg);
    color: var(--text-2);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-size: 1.05rem;
    color: var(--text);
    margin: 0 0 6px;
  }
  .lead {
    font-size: 0.82rem;
    color: var(--muted);
    margin: 0 0 22px;
    line-height: 1.6;
  }
  .cols {
    display: grid;
    grid-template-columns: repeat(3, minmax(230px, 280px));
    gap: 24px;
    align-items: start;
  }
  .col-card {
    background: var(--sidebar);
    border: 1px solid var(--border-2);
    border-radius: 10px;
    padding: 14px 12px 18px;
  }
  .col-tag {
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .col-tag b { color: var(--text); font-size: 0.78rem; }
  .badge-rec {
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(0, 122, 204, 0.16);
    color: #4fa3e3;
    font-size: 0.68rem;
  }

  .nav-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .group-title {
    font-size: 0.72rem;
    color: var(--muted);
    padding: 4px 10px 6px;
  }
  .nav-link {
    display: flex;
    align-items: center;
    padding: 7px 12px;
    border-radius: 6px;
    color: var(--text-2);
    font-size: 0.9rem;
    cursor: pointer;
    border: none;
    background: transparent;
    text-align: left;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .nav-link:hover {
    background: var(--surface-3);
    color: var(--text);
  }
  .nav-link.active {
    background: rgba(0, 122, 204, 0.16);
    color: #4fa3e3;
    font-weight: 600;
  }

  /* 与 OnlineSidebar .bm-children 完全同构的 32px 缩进区 */
  .sub-children {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-left: 32px;
    margin-top: 2px;
  }
  .top-action-btn {
    width: 100%;
    margin: 2px 0 4px;
    padding: 5px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-2);
    font-size: 0.8rem;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
  }
  .top-action-btn:hover {
    border-color: var(--blue);
    color: var(--blue);
  }
  .child-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    width: 100%;
    padding: 6px 8px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    font-size: 0.8rem;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
  }
  .child-item:hover {
    background: var(--surface-3);
    color: var(--text);
  }
  .child-item.active {
    background: rgba(0, 122, 204, 0.16);
    color: #4fa3e3;
    font-weight: 600;
  }
  .child-title {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mini-count {
    font-size: 0.7rem;
    padding: 1px 6px;
    border-radius: 9px;
    background: var(--surface-3);
    color: var(--text-2);
    flex-shrink: 0;
  }
  .mini-count.cleared {
    background: rgba(76, 195, 138, 0.16);
    color: var(--green);
  }

  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: #222;
    border: 1px solid var(--blue);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 7px;
    font-size: 0.82rem;
    opacity: 0;
    pointer-events: none;
    transition: all 0.18s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 820px) {
    .cols { grid-template-columns: 1fr; max-width: 300px; }
  }
</style>
</head>
<body>
<h1>侧边栏改造对比：书架向书签看齐</h1>
<p class="lead">
  改动要点：去掉「书架」折叠箭头改为点击直达书架墙；去掉「全部书架」与「未读本数」按钮；「新建书架」放到与「检查更新」对称的顶部边框按钮位；置顶项去掉图钉/拖拽/菜单杂项（统一在书架墙管理）。
</p>

<div class="cols">
  <!-- 左列：参照（在线模式 · 书签现状） -->
  <div class="col-card">
    <div class="col-tag"><b>参照：在线 · 书签（现状）</b><span>基准</span></div>
    <div class="nav-group">
      <div class="group-title">🌐 在线模式</div>
      <button class="nav-link" onclick="setActive(this)">历史记录</button>
      <button class="nav-link" onclick="setActive(this)">书签</button>
      <div class="sub-children">
        <button class="top-action-btn" onclick="toast('触发书签更新探测')">检查更新（55）</button>
        <button class="child-item" onclick="setActive(this)"><span class="child-title">首页</span></button>
        <button class="child-item" onclick="setActive(this)"><span class="child-title">首页 · 仅删除</span></button>
      </div>
    </div>
  </div>

  <!-- 中列：方案 A（100% 极简对称） -->
  <div class="col-card">
    <div class="col-tag"><b>方案 A：纯标题极简</b><span class="badge-rec">推荐 · 100% 对称</span></div>
    <div class="nav-group">
      <div class="group-title">📚 离线模式</div>
      <button class="nav-link" onclick="setActive(this)">历史记录</button>
      <button class="nav-link" onclick="setActive(this); toast('进入书架墙 /offline/bookshelves')">书架</button>
      <div class="sub-children" id="listA">
        <button class="top-action-btn" onclick="createDemoShelf('A')">新建书架</button>
        <button class="child-item" onclick="setActive(this)"><span class="child-title">配菜</span></button>
        <button class="child-item" onclick="setActive(this)"><span class="child-title">很好用</span></button>
      </div>
    </div>
  </div>

  <!-- 右列：方案 B（保留轻量数字徽标） -->
  <div class="col-card">
    <div class="col-tag"><b>方案 B：保留轻量徽标</b><span>备选</span></div>
    <div class="nav-group">
      <div class="group-title">📚 离线模式</div>
      <button class="nav-link" onclick="setActive(this)">历史记录</button>
      <button class="nav-link" onclick="setActive(this); toast('进入书架墙 /offline/bookshelves')">书架</button>
      <div class="sub-children" id="listB">
        <button class="top-action-btn" onclick="createDemoShelf('B')">新建书架</button>
        <button class="child-item" onclick="setActive(this)">
          <span class="child-title">配菜</span>
          <span class="mini-count">8/14</span>
        </button>
        <button class="child-item" onclick="setActive(this)">
          <span class="child-title">很好用</span>
          <span class="mini-count cleared">1</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1600);
}

function setActive(btn) {
  const card = btn.closest('.col-card');
  card.querySelectorAll('.nav-link, .child-item').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
}

function createDemoShelf(which) {
  const name = window.prompt('请输入新书架名称（样板演示）', '新书架');
  if (!name || !name.trim()) return;
  const list = document.getElementById('list' + which);
  const item = document.createElement('button');
  item.className = 'child-item';
  item.onclick = () => setActive(item);
  item.innerHTML = `<span class="child-title">${name.trim()}</span>${which === 'B' ? '<span class="mini-count cleared">0</span>' : ''}`;
  list.appendChild(item);
  toast(`已创建示例书架「${name.trim()}」`);
}
</script>
</body>
</html>
